<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denah & Daftar Tamu - The Pendopo Heritage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Denah & Daftar Tamu Meja</h1>
    <p>Klik titik nomor meja pada peta untuk melihat & mengedit nama tamu</p>
  </header>

  <!-- Container Denah Gambar -->
  <main class="map-wrapper">
    <!-- Pastikan nama file gambar sesuai yang di-upload ke GitHub -->
    <img src="denah.jpg" alt="Denah Ballroom" class="map-image">

    <!-- Container Hotspot/Pin Meja Interaktif -->
    <div id="pinsContainer"></div>
  </main>

  <!-- Pop-Up Modal -->
  <div id="guestModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">Meja Nomor --</h2>
      
      <form id="guestForm">
        <div class="guest-inputs">
          <div class="input-group"><label>Kursi 1:</label><input type="text" id="seat1" placeholder="Nama Tamu 1"></div>
          <div class="input-group"><label>Kursi 2:</label><input type="text" id="seat2" placeholder="Nama Tamu 2"></div>
          <div class="input-group"><label>Kursi 3:</label><input type="text" id="seat3" placeholder="Nama Tamu 3"></div>
          <div class="input-group"><label>Kursi 4:</label><input type="text" id="seat4" placeholder="Nama Tamu 4"></div>
          <div class="input-group"><label>Kursi 5:</label><input type="text" id="seat5" placeholder="Nama Tamu 5"></div>
          <div class="input-group"><label>Kursi 6:</label><input type="text" id="seat6" placeholder="Nama Tamu 6"></div>
          <div class="input-group"><label>Kursi 7:</label><input type="text" id="seat7" placeholder="Nama Tamu 7"></div>
          <div class="input-group"><label>Kursi 8:</label><input type="text" id="seat8" placeholder="Nama Tamu 8"></div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-save" onclick="saveGuestData()">Simpan Perubahan</button>
          <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
